name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: groove-tui
            archive_name: groove-tui-linux-x86_64
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: groove-tui.exe
            archive_name: groove-tui-windows-x86_64
            archive_format: zip
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: groove-tui
            archive_name: groove-tui-macos-x86_64
            archive_format: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: groove-tui
            archive_name: groove-tui-macos-arm64
            archive_format: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} release/
          tar -czf ${{ matrix.archive_name }}.tar.gz -C release ${{ matrix.binary_name }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" release/
          Compress-Archive -Path release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.archive_name }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}.${{ matrix.archive_format }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
